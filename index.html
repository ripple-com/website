<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Camera OCR Scanner - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@v5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial; background: #0f0f23; color: #fff; text-align: center; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; }
        video, canvas { width: 100%; max-width: 600px; border: 3px solid #00ff96; border-radius: 10px; }
        button { padding: 15px 25px; margin: 10px; font-size: 18px; background: #00ff96; color: #000; border: none; border-radius: 8px; cursor: pointer; }
        .result { margin-top: 20px; padding: 15px; background: #16213e; border-radius: 10px; font-size: 20px; }
        .history { margin: 15px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📷 Aviator Camera OCR Scanner (Demo)</h1>
        <p>කැමරාවෙන් Aviator screen එක scan කරන්න. Multipliers clearව පේන්න ඕනේ!</p>
        
        <video id="video" autoplay playsinline></video>
        <canvas id="canvas" style="display:none;"></canvas>
        
        <br>
        <button onclick="startCamera()">📹 Start Camera</button>
        <button onclick="captureAndScan()">📸 Capture & Scan Odds</button>
        
        <div class="result" id="result">Camera start කරලා scan කරන්න...</div>
        
        <div class="history" id="history"></div>
    </div>

    <script>
        let video = document.getElementById('video');
        let canvas = document.getElementById('canvas');
        let ctx = canvas.getContext('2d');
        let history = [];

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
            } catch (err) {
                alert('කැමරා access deny වුණා. HTTPS එකකින් try කරන්න හෝ permissions check කරන්න.');
            }
        }

        async function captureAndScan() {
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageDataUrl = canvas.toDataURL('image/png');
            document.getElementById('result').innerHTML = 'OCR කරමින් ඉන්නවා... (කල් යයි ටිකක්)';

            try {
                const worker = await Tesseract.createWorker('eng');
                const { data: { text } } = await worker.recognize(imageDataUrl);
                await worker.terminate();

                // Simple number extraction (multipliers like 1.23, 5.67x etc.)
                const numbers = text.match(/\d+\.\d+/g) || [];
                const multipliers = numbers.map(n => parseFloat(n)).filter(n => n > 0 && n < 100);

                if (multipliers.length > 0) {
                    history.unshift(...multipliers.slice(0, 5)); // last few
                    if (history.length > 10) history = history.slice(0, 10);

                    const avg = multipliers.reduce((a,b)=>a+b,0)/multipliers.length;
                    const predicted = Math.max(2.5, (avg * 1.2) + (Math.random() * 4));

                    document.getElementById('result').innerHTML = `
                        ✅ Extracted Multipliers: ${multipliers.join(', ')}<br>
                        <strong>ඊළඟ High Signal: ~${predicted.toFixed(1)}x+</strong><br>
                        <small>Scan කළ history එක මත පදනම්ව simulation එකක් විතරයි. Real predict නොවෙයි!</small>
                    `;

                    document.getElementById('history').innerHTML = `<strong>Detected History:</strong> \( {history.map(h => `<span style="background:#ff3366;padding:5px 10px;border-radius:20px;margin:3px;"> \){h}x</span>`).join('')}`;
                } else {
                    document.getElementById('result').innerHTML = '❌ Multipliers හොයාගන්න බැරි වුණා. Screen එක clearව පේන්න බලන්න (lighting + focus).';
                }
            } catch (e) {
                document.getElementById('result').innerHTML = 'OCR error: ' + e.message;
            }
        }
    </script>
</body>
</html>
